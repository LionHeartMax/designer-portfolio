<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Portfolio</title>
    <style>
        :root { --primary: #000; --bg: #f4f4f4; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .admin-card { background: var(--white); padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 30px; }
        h1, h2 { color: var(--primary); margin-top: 0; }
        
        /* Selection Grid */
        .selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin: 20px 0; }
        .select-card { 
            border: 2px solid #eee; padding: 10px; cursor: pointer; border-radius: 10px; 
            text-align: center; transition: 0.2s; position: relative; background: #fff;
        }
        .select-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
        .select-card p { font-size: 14px; margin: 10px 0 0; font-weight: 600; }
        
        /* Selected State */
        .select-card.selected { border-color: var(--primary); background: #fafafa; transform: scale(1.02); }
        .select-card.selected::before {
            content: '✓'; position: absolute; top: -10px; right: -10px; 
            background: var(--primary); color: #fff; width: 28px; height: 28px; 
            border-radius: 50%; line-height: 28px; font-weight: bold;
        }

        .btn-save { 
            background: var(--primary); color: #fff; padding: 15px 30px; 
            border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; 
            width: 100%; transition: 0.3s;
        }
        .btn-save:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Control</h1>
        
        <div class="admin-card">
            <h2>Manage Featured Work</h2>
            <p>Select which projects appear on your Home Page hero section.</p>
            <div id="featured-selection-list" class="selector-grid">
                </div>
            <button id="save-featured-btn" class="btn-save">Save Home Page Changes</button>
        </div>

        <div class="admin-card">
            <a href="index.html" style="text-decoration: none; color: #666;">← Back to Website</a>
        </div>
    </div>

    <script src="js files/admin.js"></script>
</body>
</html>
