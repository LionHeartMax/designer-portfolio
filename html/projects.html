<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Work | Portfolio</title>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <section style="margin-top: 50px;">
            <h1>Selected <span style="color: var(--primary-red);">Works</span></h1>
            
            <div class="controls" style="margin: 30px 0; display: flex; gap: 15px; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="Search projects..." 
                       style="padding: 12px; flex-grow: 1; background: var(--card-bg); border: 1px solid #333; color: white; border-radius: 4px;">
                
                <select id="categoryFilter" style="padding: 12px; background: var(--card-bg); border: 1px solid #333; color: white; border-radius: 4px;">
                    <option value="all">All Categories</option>
                </select>
            </div>

            <!-- Project Grid -->
            <div id="projects-grid" class="project-grid"></div>

            <!-- Load More Button -->
            <div style="text-align: center; margin: 50px 0;">
                <button id="load-more-btn" class="btn-primary" style="display: none;">Load More</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js files/store.js"></script>
    <script src="/js files/components.js"></script>
    
    <script>
    const grid = document.getElementById('projects-grid');
    const search = document.getElementById('searchInput');
    const filter = document.getElementById('categoryFilter');
    const loadMoreBtn = document.getElementById('load-more-btn');

    let allProjects = []; // Keeps track of all loaded projects for searching/filtering
    let currentPage = 0;
    const itemsPerPage = 12;

    async function initGallery() {
        // 1. Load categories dynamically
        const cats = await Store.getCategories();
        filter.innerHTML = `<option value="all">All Categories</option>` + 
                           cats.map(c => `<option value="${c}">${c}</option>`).join('');
        
        // 2. Fetch first batch of projects
        await loadMoreProjects();
    }

    async function loadMoreProjects() {
        // Fetch only the next 12 from Supabase
        const newProjects = await Store.getProjects(currentPage, itemsPerPage);
        
        if (newProjects.length > 0) {
            // Add them to our global list
            allProjects = [...allProjects, ...newProjects];
            
            // Render only the new items to the grid
            appendRender(newProjects);
            
            // Show/Hide "Load More" button based on results
            if (newProjects.length === itemsPerPage) {
                loadMoreBtn.style.display = 'inline-block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        } else {
            loadMoreBtn.style.display = 'none';
        }
    }

    // This function adds to the grid instead of clearing it
    function appendRender(items) {
        const html = items.map(p => Components.projectCard(p)).join('');
        grid.insertAdjacentHTML('beforeend', html);
    }

    // This function is for searching/filtering (it clears and re-renders)
    function fullRender(items) {
        grid.innerHTML = items.map(p => Components.projectCard(p)).join('');
    }

    // Handle Search and Filter
    [search, filter].forEach(el => el.addEventListener('input', () => {
        const val = search.value.toLowerCase();
        const cat = filter.value;
        
        const filtered = allProjects.filter(p => {
            const matchSearch = p.title.toLowerCase().includes(val);
            const matchCat = cat === 'all' || p.category === cat;
            return matchSearch && matchCat;
        });

        // If searching, hide the load more button to avoid logic conflicts
        if (val !== "" || cat !== "all") {
            loadMoreBtn.style.display = 'none';
        } else if (allProjects.length % itemsPerPage === 0) {
            loadMoreBtn.style.display = 'inline-block';
        }

        fullRender(filtered);
    }));

    // "Load More" Button Click
    loadMoreBtn.addEventListener('click', () => {
        currentPage++;
        loadMoreProjects();
    });

    // Start
    initGallery();
    </script>
</body>
</html>
