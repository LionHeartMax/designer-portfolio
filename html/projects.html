<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Work | Portfolio</title>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <section style="margin-top: 50px;">
            <h1>Selected <span style="color: var(--primary-red);">Works</span></h1>
            
            <div class="controls" style="margin: 30px 0; display: flex; gap: 15px; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="Search projects..." 
                       style="padding: 12px; flex-grow: 1; background: var(--card-bg); border: 1px solid #333; color: white; border-radius: 4px;">
                
                <select id="categoryFilter" style="padding: 12px; background: var(--card-bg); border: 1px solid #333; color: white; border-radius: 4px;">
                    <option value="all">All Categories</option>
                </select>
            </div>

            <!-- Project Grid -->
            <div id="projects-grid" class="project-grid"></div>

            <!-- Load More Button -->
            <div style="text-align: center; margin: 50px 0;">
                <button id="load-more-btn" class="btn-primary" style="display: none;">Load More</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js files/store.js"></script>
    <script src="/js files/components.js"></script>
    
    <script>
    const grid = document.getElementById('projects-grid');
    const search = document.getElementById('searchInput');
    const filter = document.getElementById('categoryFilter');
    const loadMoreBtn = document.getElementById('load-more-btn');

    let allProjects = []; // The master list of all 80+ projects
    let visibleCount = 12; // How many to show initially

    async function initGallery() {
        // 1. Load categories dynamically
        const cats = await Store.getCategories();
        filter.innerHTML = `<option value="all">All Categories</option>` + 
                           cats.map(c => `<option value="${c}">${c}</option>`).join('');
        
        // 2. Fetch EVERY project at once using the new Store function
        // This ensures categories and search work on the full dataset immediately
        allProjects = await Store.getAllProjects();
        
        // 3. Initial Render
        renderGallery();
    }

    function renderGallery() {
        const searchTerm = search.value.toLowerCase();
        const selectedCat = filter.value;

        // Filter the full list based on Search and Category
        const filtered = allProjects.filter(p => {
            const matchSearch = p.title.toLowerCase().includes(searchTerm);
            const matchCat = selectedCat === 'all' || p.category === selectedCat;
            return matchSearch && matchCat;
        });

        // Logic: 
        // If filtering/searching, show ALL results.
        // If viewing "All", only show the amount specified by visibleCount.
        const isFiltering = searchTerm !== "" || selectedCat !== "all";
        const toDisplay = isFiltering ? filtered : filtered.slice(0, visibleCount);

        // Update the Grid
        grid.innerHTML = toDisplay.map(p => Components.projectCard(p)).join('');

        // Show/Hide "Load More" button
        // Only show it if we are NOT filtering and there are more items to reveal
        if (!isFiltering && visibleCount < filtered.length) {
            loadMoreBtn.style.display = 'inline-block';
        } else {
            loadMoreBtn.style.display = 'none';
        }
    }

    // Handle Search and Filter inputs
    [search, filter].forEach(el => el.addEventListener('input', () => {
        renderGallery();
    }));

    // "Load More" Button Click
    loadMoreBtn.addEventListener('click', () => {
        visibleCount += 12; // Reveal the next 12
        renderGallery();
    });

    // Start the process
    initGallery();
    </script>
</body>
</html>
